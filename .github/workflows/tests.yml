name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ts-test:
    name: TypeScript Plugin Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Run Vitest test suite
        run: npm test
      - name: Build plugin bundle
        run: npm run build

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Test the installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -m color_math --self-test
      - name: Run exact repository tests
        run: python -m tests.self_test
      - name: Check installed dependencies
        run: python -m pip check
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
