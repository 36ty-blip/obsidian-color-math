name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ts-test:
    name: TypeScript Plugin Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Pre-flight integrity & Linter audit
        run: npm run check:all
      - name: Run Vitest test suite
        run: npm test
      - name: Build plugin bundle
        run: npm run build
