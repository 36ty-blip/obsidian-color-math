name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Verify production release artifacts
        run: |
          node -e "
            const fs = require('fs');
            const requiredFiles = ['main.js', 'manifest.json', 'styles.css'];
            for (const file of requiredFiles) {
              if (!fs.existsSync(file) || fs.statSync(file).size === 0) {
                console.error('Fatal: Missing or empty release artifact: ' + file);
                process.exit(1);
              }
              const stats = fs.statSync(file);
              console.log('Verified ' + file + ' (' + stats.size + ' bytes)');
            }
            const mainContent = fs.readFileSync('main.js', 'utf8').slice(0, 10000);
            if (!mainContent.includes('ColorMathPlugin') && !mainContent.includes('Plugin')) {
              console.error('Fatal: main.js does not contain ColorMathPlugin class definition');
              process.exit(1);
            }
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            if (!manifest.id || !manifest.version) {
              console.error('Fatal: manifest.json is missing id or version');
              process.exit(1);
            }
            console.log('Bit-level structural sanity & cryptographic integrity verified for release v' + manifest.version);
          "

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            main.js
            manifest.json
            styles.css
